[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# Editable-install the TinkerCloud server so `training` is importable on the
# server AND on Ray workers (same venv), matching how nemo_rl / tinker /
# tinker_cookbook are already installed. Fixes the /app-not-on-worker-path
# misplacement that otherwise blocks shipping tinker-cloud code to workers
# (e.g. training.backends.nemo_rl.losses.TinkerSumCELoss — see BUG-015).
name = "tinkercloud-training"
version = "0.1.0"
description = "TinkerCloud multi-backend post-training server"
requires-python = ">=3.10"
# No dependencies declared on purpose: install with --no-deps, the runtime
# image already provides everything. This entry only creates the import path.

[tool.setuptools.packages.find]
# gates ships with the service: the suite must version with the server it
# certifies (specs/014 design S6 Q1).
include = ["training*", "gates*"]

[tool.setuptools.package-data]
gates = ["verdicts/*.json"]

[tool.pytest.ini_options]
# Bare `pytest` is the CPU suite; tests/gpu is run by path (its conftest marks
# every test `gpu`). Test dirs are packages so same-named files can coexist.
testpaths = ["tests/unit", "tests/conformance"]
markers = ["gpu: needs GPUs and starts its own Ray; run by path"]
# pytest-timeout: a test that waits on a server that is not there fails here
# instead of holding the suite; tests/gpu raises its own limit in its conftest.
timeout = 120

[tool.ruff]
# generated by protoc, copied verbatim from the tinker SDK
extend-exclude = ["training/proto/tinker_public_pb2.py"]

[tool.ruff.lint.per-file-ignores]
# tests set up fixtures on one line (`a = x; b = y`); the F rules (undefined
# names, unused imports) are what the lint is there for
"tests/**" = ["E702"]

[tool.pyright]
# Static check of the backend seam only: our own handle / config / datum
# types must be read as declared (no getattr-with-default, no dynamic
# attributes). Engine imports (nemo_rl, miles, torch, ray) are not installed
# where the check runs, so their symbols are Unknown and unchecked.
include = ["training/backends"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingModuleSource = false
