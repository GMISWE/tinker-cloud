name: lint

on:
  push:
    branches: [main]
  pull_request:

# both jobs only read the checkout
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.11 pyright==1.1.405
      - run: ruff check training/ tests/
      # Type check of the backend seam (pyproject [tool.pyright]); engine
      # packages are not installed here, so only our own types are checked.
      - run: pyright
      # tree rules ruff cannot see: doc paths exist, test dirs are packages, no sibling-test imports
      - run: scripts/check_tree.sh
      # the runner ships shellcheck; `source=` directives resolve from the repo root
      - run: shellcheck -S warning $(git ls-files '*.sh')

  tests:
    # The unit suite. `import training` pulls the
    # FastAPI app and Ray; the checkpoint interchange tests need CPU torch.
    # tests/conformance needs the tinker SDK, which is not installable here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # server deps pinned to the pod image (scripts/pod_state.sh prints them); keep in step
      - run: pip install pytest pytest-timeout uvicorn==0.38.0 fastapi==0.141.1 pydantic==2.12.3 httpx==0.27.2 aiohttp==3.14.3 safetensors numpy orjson ray torch huggingface_hub==1.9.2
                 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      # the tests import the tree as the `tinkercloud` package (as pod_pytest.sh aliases it)
      - run: mkdir -p /tmp/ns && ln -s "$PWD" /tmp/ns/tinkercloud
      - run: PYTHONPATH=/tmp/ns python -m pytest tests/unit -q -p no:cacheprovider --durations=10
